name: trflow
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy<2                 # OpenFold (2021) uses np.float/old APIs removed in numpy 2
  - scipy>=1.7
  - biopython==1.80         # Bio.PDB / Bio.SeqIO (trflow + vendored OpenFold)
  - einops                  # trflow/networks.py + trRosettaX2 modules
  - pip:
      # CUDA 11.8 supports the NVIDIA 535-series driver used on the test node.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.6.0+cu118
      # OpenFold init-structure subprocess
      - ml_collections
      - absl-py
      - pytorch_lightning
      - tqdm
      # --only-binary: dm-tree has no working source build under cp311; pin 0.1.9
      # which ships a manylinux wheel (PyPI now resolves newer sdists that fail).
      - --only-binary dm-tree
      - dm-tree==0.1.9
      # ESM-MSA-1b is VENDORED at esm/; no `esm` install needed.
      # run_trflow.py puts the vendored copy first on sys.path.
